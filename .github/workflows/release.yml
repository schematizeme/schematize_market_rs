name: release-market

# Compila o `schematize-market` para Linux/macOS/FreeBSD (Windows: `schematize_windows_rs`, ADR-0026) e anexa os binários ao release.
#
# POR QUE ESTE WORKFLOW É BLOQUEANTE DO ADR-0013 (decisão D2), e não acabamento:
#
# O `schematize-updater` era o único artefato que a casa publicava pré-compilado por SO — e o
# `install.sh` o baixava pronto justamente por ele ser pequeno e estável. Ao herdar o papel de
# gestor, o market herda a obrigação. Enquanto ele só compilar do fonte, "instalar o market"
# custa minutos e um toolchain, e o bootstrap continuaria precisando do updater para o caminho
# rápido — ou seja, a unificação não teria acontecido de fato.
#
# Roda SÓ em push de tag `v*`: publicar binário é ato de release, não de commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Portão barato ANTES de gastar quatro runners: um teste vermelho tem de reprovar aqui, e não
  # depois de publicar um binário quebrado para usuário real. Deletar um release não desfaz o
  # download de quem já pegou.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Formato, lints e testes
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  build:
    needs: gate
    strategy:
      # `fail-fast: false` de propósito: uma plataforma que falha não pode cancelar as outras.
      # Publicar três dos quatro assets é melhor que publicar nenhum — quem está nas três tem
      # o caminho rápido, e a quarta cai no build do fonte, que continua funcionando.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: schematize-market-linux-x86_64
            asset_gui: schematize-market-gui-linux-x86_64
          # `macos-15`, NÃO `macos-14`. Duas imagens já morderam esta casa:
          #   - `macos-13` foi APOSENTADA, e um job que a peça fica *queued para sempre* em vez
          #     de falhar — segura o release inteiro sem nunca dar erro. Já custou uma passada.
          #   - `macos-14` está marcada DEPRECATED no `actions/runner-images` (issue 13518) e
          #     segue o mesmo caminho. O CLI e o updater ainda a usam; este workflow nasce na
          #     imagem viva em vez de herdar a dívida.
          - os: macos-15
            target: aarch64-apple-darwin
            asset: schematize-market-macos-arm64
            asset_gui: schematize-market-gui-macos-arm64
          # Intel CROSS-COMPILADO no runner arm64, por `--target`. Assim o release não depende
          # de imagem macOS x64 nenhuma — que é justamente a família que vem sendo aposentada.
          - os: macos-15
            target: x86_64-apple-darwin
            asset: schematize-market-macos-x86_64
            asset_gui: schematize-market-gui-macos-x86_64
          # Windows: SEM entrada aqui. Os `schematize-market*.exe` agora saem do repo
          # `schematize_windows_rs` (ADR-0026), que depende desta lib e provê o `Plataforma`
          # e as `Receitas` do Windows. Este repo é Unix-only.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}
      # O binário TEM de responder `--version` antes de ser publicado. Um asset que não executa
      # baixa com HTTP 200 e só falha na máquina de quem instalou — e é exatamente o que o
      # self-update (D3) tem de recusar depois. Recusar aqui é mais barato.
      #
      # Só nos alvos NATIVOS do runner: o binário Intel cross-compilado no runner arm64 não roda
      # ali, e afirmar que roda seria o teste mentindo.
      - name: O asset executa? (alvos nativos)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/schematize-market"
          "$bin" --version
      # A JANELA do gestor, publicada AO LADO do binário (ADR-0014 D5).
      #
      # Ela vive em repo próprio (`schematize-updater-gui` — o repo mantém o nome antigo; o
      # binário, não: ver o README de lá). Sai daqui porque o dono do binário é o dono da
      # janela dele, e porque acrescentar um asset a esta esteira custa este bloco, enquanto
      # um release próprio custaria outra matriz de quatro alvos e outra tag para lembrar de
      # cortar.
      #
      # Best-effort: se ela não compilar, o release do market NÃO falha. O gestor headless é o
      # que precisa chegar; a janela é a interface amigável por cima dele. Falhar o release
      # inteiro por causa dela inverteria a prioridade.
      # As libs de X11/Wayland/GL/fontconfig que o Slint precisa pra LINKAR no Linux. macOS e
      # Windows trazem o stack grafico nativo; o runner ubuntu nao traz nada disso.
      #
      # POR QUE ESTE PASSO NASCEU DEPOIS: sem ele a janela compilava no macOS e no Windows e
      # falhava so no Linux — e falhava EM SILENCIO, porque `continue-on-error: true` faz o
      # `conclusion` do passo virar `success` mesmo com `outcome: failure`. O release saia
      # "verde", com 7 assets em vez de 8, e o unico que faltava era o da plataforma principal.
      # O `install_janela_do_gestor()` do install.sh baixaria um asset que nunca existiu.
      #
      # A lista e a mesma do release do CLI, que ja publica GUI pra Linux — a diferenca entre
      # os dois workflows era esta, e so esta.
      - name: deps da janela (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev

      - name: Janela do gestor (opcional)
        id: janela
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/schematizeme/schematize-updater-gui.git ../janela
          cargo build --release --locked --manifest-path ../janela/Cargo.toml \
            --target ${{ matrix.target }}
          cp "../janela/target/${{ matrix.target }}/release/schematize-market-gui" \
             "${{ matrix.asset_gui }}"

      - name: Nomear o asset
        run: cp target/${{ matrix.target }}/release/schematize-market ${{ matrix.asset }}
      - name: Anexar ao release
        uses: softprops/action-gh-release@v2
        with:
          # A janela entra só se o passo dela deu certo — `continue-on-error` deixa o job
          # seguir, e sem esta condição o upload tentaria anexar um arquivo que não existe.
          files: |
            ${{ matrix.asset }}
            ${{ steps.janela.outcome == 'success' && matrix.asset_gui || '' }}

  # FreeBSD x86_64 — job PRÓPRIO porque o runner não é FreeBSD: o CLI é CROSS-COMPILADO com
  # `cross` (imagem do alvo x86_64-unknown-freebsd) e depois EXECUTADO de verdade numa VM FreeBSD
  # (vmactions). Compilar não prova que roda — um asset que baixa com HTTP 200 e não executa só
  # falha na máquina de quem instalou, e o self-update tem de recusá-lo. Por isso o smoke é
  # parte do release, não enfeite.
  #
  # Tudo PINADO: `cross` na versão exata (sem `latest`), a VM por SHA de commit (tag v1.5.9) e o
  # release do FreeBSD fixo. `fail-fast` não se aplica (um alvo só), mas o job é independente do
  # `build`: FreeBSD falhar não cancela os outros quatro assets.
  build-freebsd:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-freebsd
            asset: schematize-market-freebsd-x86_64
            asset_gui: schematize-market-gui-freebsd-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: cross 0.2.5 (versão pinada)
        run: |
          set -euo pipefail
          rustup target add ${{ matrix.target }}
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cross" --version
      - name: Build (release, cross)
        run: |
          "$RUNNER_TEMP/cross" build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/schematize-market ${{ matrix.asset }}
      # O binário TEM de executar num FreeBSD de verdade antes de ser publicado.
      - name: O asset executa? (VM FreeBSD)
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.2"
          usesh: true
          copyback: false
          run: |
            set -eu
            uname -sr
            [ "$(uname -s)" = "FreeBSD" ]
            chmod +x ./${{ matrix.asset }}
            out="$(./${{ matrix.asset }} --version)"
            echo "$out"
            case "$out" in
              schematize-market*) ;;
              *) echo "saída de --version inesperada: $out" >&2; exit 1 ;;
            esac
      # A JANELA, best-effort como nos outros alvos: compilada NATIVAMENTE dentro da VM (o Slint
      # precisa das libs X11/GL do FreeBSD, que a imagem do `cross` não tem). Se não compilar, o
      # release do market NÃO falha — o gestor headless é o que precisa chegar.
      - name: Janela do gestor (opcional, VM FreeBSD)
        id: janela
        continue-on-error: true
        timeout-minutes: 60
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.2"
          usesh: true
          copyback: true
          prepare: |
            pkg install -y git curl pkgconf libX11 libXcursor libXrandr libXi \
              libxkbcommon wayland mesa-libs libxcb fontconfig dejavu
          run: |
            set -eu
            # Toolchain via rustup: o rustc do pkg do FreeBSD 14.2 e antigo demais (lockfile v4, MSRV do Slint).
            fetch -o /tmp/rustup.sh https://sh.rustup.rs
            sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
            PATH="$HOME/.cargo/bin:$PATH"; export PATH
            rustc --version; cargo --version
            # cb: roda cargo com log; se falhar, ecoa as ultimas 40 linhas como ::error:: (annotation legivel).
            cb() {
              if cargo "$@" > /tmp/build.log 2>&1; then return 0; fi
              tail -40 /tmp/build.log | sed 's/^/::error::/'
              return 1
            }
            git clone --depth 1 https://github.com/schematizeme/schematize-updater-gui.git /tmp/janela
            CARGO_TARGET_DIR=/tmp/janela-target; export CARGO_TARGET_DIR; cb build --release --locked \
              --manifest-path /tmp/janela/Cargo.toml
            cp /tmp/janela-target/release/schematize-market-gui ./${{ matrix.asset_gui }}
            test -s ./${{ matrix.asset_gui }}
      - name: Anexar ao release
        uses: softprops/action-gh-release@v2
        with:
          # A janela entra só se o passo dela deu certo (mesma condição do job `build`).
          files: |
            ${{ matrix.asset }}
            ${{ steps.janela.outcome == 'success' && matrix.asset_gui || '' }}
