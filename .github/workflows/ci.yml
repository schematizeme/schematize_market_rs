name: ci

# POR QUE ISTO EXISTE, E POR QUE NASCE JUNTO COM O REPO
#
# O `schematize_cli_rs` viveu com 431 testes e NENHUM workflow que os rodasse. A Definition
# of Done da casa exige "CI verde", e sem workflow a frase era verdadeira por vacuidade — a
# pior maneira de uma regra ser cumprida. Custou uma passada dedicada para consertar.
#
# Este repo não repete isso: o CI entra no mesmo marco em que o código entra. Um repo que
# nasce sem CI não "ganha CI depois"; ele ganha o hábito de fundir sem verificar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # O `--locked` PRECISA vir antes de qualquer outro comando cargo, e isso nao e estilo.
      #
      # Ele prova que o Cargo.lock COMMITADO resolve. Mas `clippy` e `test` reescrevem o lock
      # no disco ao rodar — entao, colocado depois deles, o guard mede um lock que os passos
      # anteriores acabaram de consertar. Foi o que aconteceu no deployer: verde no CI sobre um
      # lock defasado, e a falha so apareceu no RELEASE, que parte de checkout limpo — `cannot
      # update the lock file`, DEPOIS da tag cortada.
      #
      # Um guard cuja posicao no pipeline o desarma e pior que guard nenhum: ele da o verde.
      - name: o Cargo.lock commitado resolve (ANTES de qualquer cargo)
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: testes
        run: cargo test --all-targets

      # A 2ª passada caça teste que depende de ordem ou de estado deixado pela 1ª. Barato, e
      # já pegou flaky nesta casa.
      - name: testes (segunda passada, caça a flaky)
        run: cargo test --all-targets

      # O build `--locked` prova que o Cargo.lock commitado RESOLVE — sem isto, um lock
      # desatualizado só aparece na máquina de quem clona.
      - name: build --locked
        run: cargo build --locked
