[package]
name = "schematize-market"
version = "0.1.0"
edition = "2021"
description = "schematize market: instala e remove programas — linguagens (docker|mise|distro|official), ferramentas de dev e os apps do ecossistema."
license = "MIT"

[lib]
name = "market"
path = "src/lib.rs"

# O binário leva `schematize-` no nome (ADR-0012): é o que faz um `schematize-<TAB>` no
# terminal listar a casa inteira. O menu de aplicativos já resolvia; o terminal não.
[[bin]]
name = "schematize-market"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Perfil IDÊNTICO ao dos outros repos: o install.sh compila todos com um `CARGO_TARGET_DIR`
# único, e cargo só reaproveita artefato se o perfil bater EXATAMENTE. É o que faz cinco apps
# compilarem as dependências comuns UMA vez, não cinco.
[profile.release]
strip = true
opt-level = 3
lto = "thin"

