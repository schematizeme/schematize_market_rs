[package]
name = "schematize-market"
# 0.2.0 — o market absorveu o `schematize_updater_rs` (ADR-0013) e passou a ser o dono de
# INSTALAR e ATUALIZAR: +2.085 linhas portadas e cinco comandos novos (`update`, `pin`,
# `unpin`, `status`, `run`). Menor, e nao patch, porque a superficie publica cresceu.
#
# O `main` carrega a versao a frente da tag, como no resto da casa (o CLI esta em 0.62.0 com
# v0.55.7 publicado). Cortar a tag e chamada humana — ver o BLOCKED do overdev.
version = "0.2.1"
edition = "2021"
description = "schematize market: instala e ATUALIZA — linguagens (docker|mise|distro|official), ferramentas de dev, os apps do ecossistema, o app e ele mesmo."
license = "MIT"

[lib]
name = "market"
path = "src/lib.rs"

# O binário leva `schematize-` no nome (ADR-0012): é o que faz um `schematize-<TAB>` no
# terminal listar a casa inteira. O menu de aplicativos já resolvia; o terminal não.
[[bin]]
name = "schematize-market"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Perfil IDÊNTICO ao dos outros repos: o install.sh compila todos com um `CARGO_TARGET_DIR`
# único, e cargo só reaproveita artefato se o perfil bater EXATAMENTE. É o que faz cinco apps
# compilarem as dependências comuns UMA vez, não cinco.
[profile.release]
strip = true
opt-level = 3
lto = "thin"

